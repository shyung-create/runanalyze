<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>runanalyze — sign in</title>
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-card { width: min(340px, 90vw); }
  .login-card h1 { font-size: 18px; margin: 0 0 14px; }
  .login-card input {
    width: 100%; padding: 10px 12px; margin-bottom: 12px; font: inherit;
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--ink);
  }
  .login-card button {
    width: 100%; padding: 10px; font: inherit; font-weight: 600; cursor: pointer;
    border: none; border-radius: 8px; background: var(--s1); color: white;
  }
  .login-error { color: var(--critical); font-size: 13px; margin-bottom: 10px; }
</style>
</head>
<body>
  <form class="card login-card" method="post" action="/login">
    <h1>runanalyze</h1>
    {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
    <input type="password" name="password" placeholder="Dashboard password" autofocus required autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
