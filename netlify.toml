[build]
  publish = "docs"

# Data files change on every refresh.py push — never let Netlify's CDN
# serve a stale cached copy. app.js also cache-busts with a ?v= query
# param, but this covers direct requests too.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
